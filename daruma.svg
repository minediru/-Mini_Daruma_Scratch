<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <!-- Daruma Body Gradient -->
    <radialGradient id="darumaRedGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="65%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#990B0B" />
    </radialGradient>

    <!-- Face Gradient -->
    <radialGradient id="faceCreamGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="85%" stop-color="#F7EED8" />
      <stop offset="100%" stop-color="#E5D6BD" />
    </radialGradient>

    <!-- Beer Liquid Gradient -->
    <linearGradient id="beerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="25%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Gold Belly Stripes -->
    <linearGradient id="goldStripeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="charaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3E1414" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#charaShadow)">
    <!-- Main Daruma Round Red Body -->
    <ellipse cx="120" cy="120" rx="72" ry="74" fill="url(#darumaRedGrad)" stroke="#7F0B0B" stroke-width="2.5" />

    <!-- Belly Golden Curved Vertical Stripes ( ( ) ) -->
    <g fill="none" stroke="url(#goldStripeGrad)" stroke-width="6" stroke-linecap="round" opacity="0.95">
      <path d="M 96,152 Q 90,166 94,178" />
      <path d="M 108,154 Q 104,168 108,180" />
      <path d="M 132,154 Q 136,168 132,180" />
      <path d="M 144,152 Q 150,166 146,178" />
    </g>

    <!-- White/Cream Smiling Face Area -->
    <path d="M 120,62 C 86,62 70,78 68,98 C 66,118 78,136 100,144 C 114,149 132,149 146,143 C 166,134 174,116 172,98 C 170,78 152,62 120,62 Z"
          fill="url(#faceCreamGrad)" stroke="#B3895B" stroke-width="2" />

    <!-- Cute Rosy Cheeks -->
    <ellipse cx="84" cy="116" rx="9" ry="6" fill="#FF8A80" opacity="0.65" />
    <ellipse cx="156" cy="116" rx="9" ry="6" fill="#FF8A80" opacity="0.65" />

    <!-- Thick Black Calligraphy Eyebrows -->
    <!-- Left Eyebrow -->
    <path d="M 76,86 C 84,76 98,76 106,86 C 98,82 86,82 76,86 Z" fill="#1A1A1A" />
    <path d="M 78,84 Q 92,75 104,83" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Right Eyebrow -->
    <path d="M 164,86 C 156,76 142,76 134,86 C 142,82 154,82 164,86 Z" fill="#1A1A1A" />
    <path d="M 162,84 Q 148,75 136,83" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Cheek Whiskers (Traditional Daruma brush lines) -->
    <g stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round">
      <path d="M 70,105 Q 75,103 82,106" />
      <path d="M 68,111 Q 74,110 80,113" />
      <path d="M 72,117 Q 76,116 82,118" />

      <path d="M 170,105 Q 165,103 158,106" />
      <path d="M 172,111 Q 166,110 160,113" />
      <path d="M 168,117 Q 164,116 158,118" />
    </g>

    <!-- Smiling Arched Closed Eyes (^ ^) -->
    <path d="M 88,99 C 93,92 101,92 106,99" fill="none" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 134,99 C 139,92 147,92 152,99" fill="none" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" />

    <!-- Cute Nose Dots -->
    <path d="M 118,106 Q 120,108 122,106" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Big Happy Open Laughing Mouth -->
    <path d="M 102,116 C 104,136 136,136 138,116 Z" fill="#880E4F" stroke="#212121" stroke-width="2" />
    <!-- Cheerful Pink Tongue -->
    <path d="M 110,126 C 114,120 126,120 130,126 C 126,134 114,134 110,126 Z" fill="#FF5252" />

    <!-- Left Hand Holding Beer Mug (Mascot's Right Hand) -->
    <!-- Arm / Hand Nub -->
    <circle cx="68" cy="148" r="16" fill="#D32F2F" stroke="#8E0000" stroke-width="2" />

    <!-- Glass Beer Mug -->
    <g transform="translate(24, 114)">
      <!-- Mug Handle -->
      <path d="M 14,24 C 0,24 0,52 14,52" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" />
      <path d="M 14,24 C 2,24 2,52 14,52" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />

      <!-- Mug Body -->
      <rect x="12" y="16" width="34" height="48" rx="4" fill="rgba(255, 255, 255, 0.4)" stroke="#64748B" stroke-width="2" />

      <!-- Golden Bubbly Beer Liquid -->
      <rect x="14" y="24" width="30" height="38" rx="2" fill="url(#beerGrad)" />
      
      <!-- Beer Bubbles -->
      <circle cx="22" cy="36" r="1.5" fill="#FFF" opacity="0.8" />
      <circle cx="34" cy="42" r="2" fill="#FFF" opacity="0.8" />
      <circle cx="26" cy="50" r="1.5" fill="#FFF" opacity="0.8" />

      <!-- Glass Rib Reflections -->
      <line x1="22" y1="25" x2="22" y2="60" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
      <line x1="36" y1="25" x2="36" y2="60" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />

      <!-- Fluffy Overflowing Beer Foam Top -->
      <path d="M 10,16 
               C 8,8 18,6 22,12 
               C 25,4 35,4 38,12 
               C 42,6 50,8 48,16 
               C 50,22 42,24 38,20 
               C 34,22 26,22 24,20 
               C 18,24 8,22 10,16 Z" 
            fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <!-- Foam Drips down mug -->
      <path d="M 44,18 Q 45,28 42,32 Q 40,28 40,20" fill="#FFFFFF" />
      <path d="M 18,18 Q 17,26 20,28 Q 21,24 22,19" fill="#FFFFFF" />
    </g>

    <!-- Sparkles of Joy -->
    <g fill="#FFD54F" opacity="0.85">
      <!-- Top Left Sparkle -->
      <path d="M 50,70 Q 55,70 55,65 Q 55,70 60,70 Q 55,70 55,75 Q 55,70 50,70 Z" />
      <!-- Top Right Sparkle -->
      <path d="M 185,55 Q 190,55 190,50 Q 190,55 195,55 Q 190,55 190,60 Q 190,55 185,55 Z" />
    </g>
  </g>
</svg>
